name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python Sistema_Calibracao_v3_2_INSTALADOR.py
      - run: cd Sistema_Calibracao_v3_2 && python self_test.py
      - run: cd Sistema_Calibracao_v3_2 && python security_audit.py
