name: dependency-audit

on:
  push:
    paths:
      - "requirements.txt"
  pull_request:
    paths:
      - "requirements.txt"
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r requirements.txt
